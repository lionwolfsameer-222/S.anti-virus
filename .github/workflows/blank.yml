name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Folder structure banao
        run: bash setup.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: APK upload
        uses: actions/upload-artifact@v4
        with:
          name: SmartGuard-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Build log upload
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
